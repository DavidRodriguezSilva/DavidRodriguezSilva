<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 626" width="1200" height="626" role="img" aria-label="Quién soy. David Rodriguez, ingeniero de desarrollo y electrónico. América, Bogotá D.C. Primero, desarrollo. Misión: quitarle fricción a la vida de personas y empresas con herramientas simples que cumplen lo que prometen. Experiencia: apps web y de escritorio con React, Node.js y TypeScript; APIs en AWS Lambda, MySQL y pruebas automatizadas. Segundo, electrónica. Misión: llevar el software al mundo físico: medir, automatizar y controlar sistemas reales. Experiencia: circuitos y PCB en Proteus y EasyEDA; microcontroladores con Arduino y MPLAB; PLC Siemens y neumática; redes con Cisco y seguridad con OWASP.">
